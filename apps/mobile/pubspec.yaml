name: partybox_mobile
description: Party games for a group, on Android and iOS.
version: 0.1.0+1
publish_to: none
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: 2.5.5
  partybox_game_core:
    path: ../../packages/game_core
  partybox_game_content:
    path: ../../packages/game-content
dev_dependencies:
  shared_preferences_platform_interface: 2.4.2
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
  assets:
    - assets/fonts/OFL.txt

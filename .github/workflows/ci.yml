name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: partybox
          POSTGRES_PASSWORD: partybox_test
          POSTGRES_DB: partybox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partybox -d partybox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://partybox:partybox_test@127.0.0.1:5432/partybox_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: bash -n deploy/production/init.sh deploy/production/release.sh
      - run: node --test deploy/production/test-release.mjs

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: dart pub get --enforce-lockfile
        working-directory: packages/game_core
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: make check-mobile

  https:
    needs: node
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: npm ci
      - run: dart pub get --enforce-lockfile
        working-directory: packages/game_core
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: node deploy/smoke.mjs
        env:
          FLUTTER_BIN: flutter
      - run: node deploy/production/test-smoke.mjs
